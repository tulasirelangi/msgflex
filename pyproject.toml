[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msgflex"
# ── VERSION NOTE ─────────────────────────────────────────────────────────────
# Keep dynamic version.  Bioconda meta.yaml will pin via {% set version %} and
# the source tarball tag.  The installed package version comes from
# msgflex/__init__.py::__version__, which setuptools reads at build time.
# Ensure git tag vX.Y.Z matches __version__ before every release.
# ─────────────────────────────────────────────────────────────────────────────
dynamic = ["version"]
description = "Unified MSGFLEX proteomics pipeline (SPARX + XPECTRA + QUANTIX)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MSGFLEX Team", email = "wrightlab@baylor.edu" }]  # TODO: replace email
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["proteomics", "mass-spectrometry", "MS-GF+", "LFQ", "percolator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# All packages here MUST be available on bioconda or conda-forge.
# dearpygui is intentionally excluded (pip-only; see [gui] extra below).
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "pyteomics>=4.6",       
    "statsmodels>=0.14",
    "joblib>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "psutil>=5.9",
]

[project.optional-dependencies]
# ── GUI (pip-only) ────────────────────────────────────────────────────────────
gui = [
    "dearpygui>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
]

# ── Entry points ──────────────────────────────────────────────────────────────
[project.scripts]
msgflex = "msgflex.cli.main:main"
msgflex-gui = "msgflex.gui.app:launch"

# ── URLs (required by Bioconda linter) ───────────────────────────────────────
[project.urls]
Homepage = "https://github.com/thulasis/msgflex"
Repository = "https://github.com/thulasis/msgflex"
Documentation = "https://github.com/thulasis/msgflex#readme"
"Bug Tracker" = "https://github.com/thulasis/msgflex/issues"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "msgflex.__version__" }

[tool.setuptools.packages.find]
where   = ["."]
include = ["msgflex*"]

[tool.setuptools.package-data]
msgflex = ["py.typed"]
msgflex.gui = ["assets/*.png"]

# ── Dev tool configs ──────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version      = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true 

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --strict-markers"
