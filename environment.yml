name: msgflex

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - python=3.12
  - pip

  # Core scientific stack 
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - biopython>=1.85
  - psutil>=5.9

  #  ML / modeling (XPECTRA) 
  - cuda-version=12
  - scikit-learn>=1.3
  - "libxgboost=*=cuda*"
  - "py-xgboost=*=cuda*"
  - "xgboost=*=cuda*"
  - statsmodels>=0.14
  - joblib>=1.3

  # Visualization 
  - matplotlib>=3.7
  - seaborn>=0.13

  # Proteomics parsing 
  - pyteomics>=4.6
  - psims

  # utilities 
  - tqdm>=4.66
  - typer>=0.12

  #  External runtimes 
  - openjdk=11
  - mono

  # Testing 
  - pytest>=8

